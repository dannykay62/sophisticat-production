# Production stack. Deliberately a standalone file rather than an override
# of docker-compose.yml -- Compose merges list-type keys like `ports` by
# appending rather than replacing, so an override can't reliably *remove*
# the dev file's exposed ports.
#
# Run with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See deploy/README.md for the full deployment walkthrough.


x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-sophisticat_db}
      POSTGRES_USER: ${DB_USER:-sophisticat_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-sophisticat_admin} -d ${DB_NAME:-sophisticat_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-sophisticat_db}
      DB_USER: ${DB_USER:-sophisticat_admin}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      RUN_MIGRATIONS_ON_BOOT: ${RUN_MIGRATIONS_ON_BOOT:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
      INTERNAL_API_URL: http://backend:8000/api
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. shop.example.com}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - backend_static:/app/staticfiles:ro
      - backend_media:/app/media:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot:v3.2.0
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done

volumes:
  postgres_data:
  backend_static:
  backend_media:
  certbot_webroot:
  certbot_certs: