<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}Sophisticat{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#F3E9DC;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3E9DC;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#FAF7F1;border:1px solid #E8DCCF;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding:36px 40px 28px;border-bottom:1px solid #E8DCCF;">
              <span style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:24px;letter-spacing:3px;text-transform:uppercase;color:#FF073A;">
                Sophisticat
              </span>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding:40px;font-family:Helvetica,Arial,sans-serif;color:#3D0B0B;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px 36px;border-top:1px solid #E8DCCF;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#8A7563;text-align:center;">
              {% block footer %}
              <p style="margin:0 0 4px;">Sophisticat &mdash; Lagos, Nigeria</p>
              <p style="margin:0;">This is a transactional email about your account or order.</p>
              {% endblock %}
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
