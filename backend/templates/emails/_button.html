{% comment %}
Usage: {% include "emails/_button.html" with url=my_url label="Click Me" %}
{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px;">
  <tr>
    <td style="background-color:#A6701F;">
      <a href="{{ url }}" style="display:inline-block;padding:14px 32px;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#FAF7F1;text-decoration:none;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>
